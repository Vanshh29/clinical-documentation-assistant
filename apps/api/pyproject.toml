[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cda-api"
version = "0.1.0"
description = "Clinical Documentation Assistant - REST API and review workflow (demo only, synthetic data)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.32,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pyjwt>=2.9,<3",
  "cryptography>=43,<46",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "testcontainers[postgres]>=4.8,<5",
  "psycopg2-binary>=2.9,<3",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["cda_api"]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
