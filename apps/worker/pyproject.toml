[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cda-worker"
version = "0.1.0"
description = "Clinical Documentation Assistant - Kafka worker (PII redaction + LLM pipeline). Demo only, synthetic data."
requires-python = ">=3.12"
dependencies = [
  "cda-api",
  "presidio-analyzer>=2.2.355,<3",
  "spacy>=3.7,<3.9",
  "aiokafka>=0.11,<1",
  "httpx>=0.27,<1",
  "cryptography>=46.0.7,<51",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "testcontainers[postgres,kafka]>=4.8,<5",
  "psycopg2-binary>=2.9,<3",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cda_worker = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", ".", "../api/src", "../api"]

[tool.coverage.run]
source_pkgs = ["cda_worker"]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "../api/src"

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.coverage.report]
include = ["*/cda_worker/*"]
