name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q

  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: cda
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cda" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cda:ci-only@localhost:5432/cda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q --cov --cov-report=term

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/worker
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: cda
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cda" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cda:ci-only@localhost:5432/cda
      PYTHONPATH: src:../api/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
      - run: pip install -e ../api -e ".[dev]" && pip install -r models-requirements.txt
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q --cov --cov-report=term

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
