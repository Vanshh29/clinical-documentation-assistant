name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "infra/helm/cda/values-*.yaml" # image-tag bumps made by the deploy workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scans the full history on every run (the packaged action trips over a repository's root commit).
      - name: Scan all commits for secrets
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: cda
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cda" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cda:ci-only@localhost:5432/cda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev,otel]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q --cov --cov-report=term

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/worker
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: cda
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: cda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cda" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cda:ci-only@localhost:5432/cda
      PYTHONPATH: src:../api/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
      - run: pip install -e "../api[otel]" -e ".[dev]" && pip install -r models-requirements.txt
      - run: ruff check . && ruff format --check .
      - run: mypy
      # The Kafka test starts its own Redpanda container (Testcontainers).
      - run: pytest -q --cov --cov-report=term

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  eval:
    runs-on: ubuntu-24.04
    needs: [worker]
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
      - name: Install worker environment
        working-directory: apps/worker
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "../api[otel]" -e ".[dev]"
          .venv/bin/pip install -r models-requirements.txt
      - run: make test
      - run: make lint
      - name: Evaluate and gate on regressions
        run: make run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: docs/eval-report.md

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and render both environments
        run: |
          mkdir -p .render
          for env in dev prod; do
            helm lint infra/helm/cda -f infra/helm/cda/values-$env.yaml
            helm template cda infra/helm/cda -f infra/helm/cda/values-$env.yaml --namespace cda > .render/$env.yaml
          done
      - name: Validate against Kubernetes and CRD schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for env in dev prod; do
            ./kubeconform -strict -summary -kubernetes-version 1.30.0 -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              .render/$env.yaml
          done
          ./kubeconform -strict -summary -ignore-missing-schemas -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            infra/argocd
      - name: Policy tests (non-root, read-only, limits, no plaintext secrets, network policy)
        run: |
          pip install pyyaml pytest
          pytest -q infra/helm/tests

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: Format
        run: terraform fmt -recursive -check infra/terraform
      - name: Validate
        run: |
          for dir in infra/terraform infra/terraform/bootstrap; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
      - name: Lint
        run: |
          tflint --chdir=infra/terraform --init
          tflint --chdir=infra/terraform --recursive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Python dependencies
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install -q -U pip
          /tmp/audit-venv/bin/pip install -q -e "apps/api[otel]" -e apps/worker pip-audit
          /tmp/audit-venv/bin/pip-audit --skip-editable --progress-spinner off
      - name: Web dependencies (production)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          load: true
          push: false
          tags: cda-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan image (fails on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.0 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 cda-${{ matrix.component }}:ci

  config-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dockerfiles, Terraform and Kubernetes config for misconfigurations
        run: |
          docker run --rm -v "$PWD":/work aquasec/trivy:0.57.0 config --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs .terraform --skip-dirs node_modules --skip-dirs .venv /work

  e2e:
    runs-on: ubuntu-24.04
    needs: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start the full stack from the production images
        run: |
          make env
          docker compose up -d --build --wait
      - name: Run the browser tests against the containers
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 npx playwright test
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
      - run: docker compose down -v
        if: always()

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.4
        with:
          args: -color
