name: terraform-plan

# Shows what a pull request would change in AWS. Read-only role; applying is a deliberate manual step.
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    if: vars.AWS_PLAN_ROLE_ARN != ''
    strategy:
      matrix:
        environment: [dev, prod]
    env:
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_lock_table: ${{ vars.TF_LOCK_TABLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init with the shared backend
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cda/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"
      - name: Plan
        id: plan
        working-directory: infra/terraform
        run: terraform plan -input=false -lock=false -no-color -var-file=environments/${{ matrix.environment }}.tfvars | tee plan.txt
      - name: Summarise in the job summary
        if: always()
        run: |
          { echo "### terraform plan (${{ matrix.environment }})"; echo '```'; tail -n 60 infra/terraform/plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
