{{- $c := dict "root" . "component" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cda.fullname" . }}-web
  labels: {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.hpa.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "cda.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cda.selector" $c | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cda.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- include "cda.podSecurityContext" (dict "uid" .Values.podSecurity.webUid) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "cda.selector" $c | nindent 20 }}
      containers:
        - name: web
          image: {{ include "cda.image" (dict "image" .Values.images.web "name" "web") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            # The browser calls /api on this origin; nginx forwards it to the API service.
            - name: API_UPSTREAM
              value: http://{{ include "cda.fullname" . }}-api:8000
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext: {{- include "cda.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            # The entrypoint renders the nginx config here, so it needs a writable directory.
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: nginx-cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: nginx-conf, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cda.fullname" . }}-web
  labels: {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector: {{- include "cda.selector" $c | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
{{- if .Values.web.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cda.fullname" . }}-web
  labels: {{- include "cda.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "cda.fullname" . }}-web }
  minReplicas: {{ .Values.web.hpa.minReplicas }}
  maxReplicas: {{ .Values.web.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.web.hpa.targetCPUUtilizationPercentage }} }
{{- end }}
{{- if .Values.web.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cda.fullname" . }}-web
  labels: {{- include "cda.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "cda.selector" $c | nindent 6 }}
{{- end }}
