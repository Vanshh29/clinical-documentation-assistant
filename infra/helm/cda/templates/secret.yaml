{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) }}
# Local clusters only. Pass the values with --set; never commit them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cda.secretName" . }}
  labels: {{- include "cda.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
