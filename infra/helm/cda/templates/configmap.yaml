apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cda.fullname" . }}-config
  labels: {{- include "cda.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AUTH_JWT_ISSUER: {{ .Values.config.authIssuer | quote }}
  AUTH_JWT_AUDIENCE: {{ .Values.config.authAudience | quote }}
  RETENTION_DAYS: {{ .Values.config.retentionDays | quote }}
  {{- if .Values.devInfra.enabled }}
  KAFKA_BOOTSTRAP_SERVERS: {{ default (printf "%s-redpanda:9092" (include "cda.fullname" .)) .Values.config.kafkaBootstrapServers | quote }}
  {{- else }}
  KAFKA_BOOTSTRAP_SERVERS: {{ required "config.kafkaBootstrapServers is required" .Values.config.kafkaBootstrapServers | quote }}
  {{- end }}
  KAFKA_TOPIC_PARTITIONS: {{ .Values.config.kafkaTopicPartitions | quote }}
  KAFKA_REPLICATION_FACTOR: {{ .Values.config.kafkaReplicationFactor | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_MAX_INPUT_TOKENS: {{ .Values.config.llmMaxInputTokens | quote }}
  LLM_MAX_VALIDATION_RETRIES: {{ .Values.config.llmMaxValidationRetries | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
