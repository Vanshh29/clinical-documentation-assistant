{{- /* Hooks run on both `helm` and ArgoCD syncs: pre-* before the rollout, post-* after it. */ -}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cda.fullname" . }}-migrate
  labels: {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cda.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: job
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "cda.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- include "cda.podSecurityContext" (dict "uid" .Values.podSecurity.uid) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "cda.image" (dict "image" .Values.images.api "name" "api") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "cda.secretName" . }}, key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: {{- include "cda.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
{{- end }}
{{- if .Values.demoUsers.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cda.fullname" . }}-seed-demo-users
  labels: {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cda.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: job
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "cda.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- include "cda.podSecurityContext" (dict "uid" .Values.podSecurity.uid) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seed
          image: {{ include "cda.image" (dict "image" .Values.images.api "name" "api") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "-m", "cda_api.seed"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ include "cda.secretName" . }}, key: DATABASE_URL } }
            # Demo accounts only. Optional key; the demo default applies if it is absent.
            - name: SEED_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "cda.secretName" . }}, key: SEED_PASSWORD, optional: true } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext: {{- include "cda.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
{{- end }}
{{- if .Values.retention.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cda.fullname" . }}-retention
  labels: {{- include "cda.labels" . | nindent 4 }}
    app.kubernetes.io/component: job
spec:
  schedule: {{ .Values.retention.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "cda.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: job
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "cda.serviceAccountName" . }}
          automountServiceAccountToken: false
          securityContext: {{- include "cda.podSecurityContext" (dict "uid" .Values.podSecurity.uid) | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: purge
              image: {{ include "cda.image" (dict "image" .Values.images.api "name" "api") }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              command: ["python", "-m", "cda_api.retention"]
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: {{ include "cda.secretName" . }}, key: DATABASE_URL } }
                - name: RETENTION_DAYS
                  value: {{ .Values.config.retentionDays | quote }}
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
              securityContext: {{- include "cda.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
{{- end }}
