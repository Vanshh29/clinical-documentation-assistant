# Prod environment: manual sync in ArgoCD. Managed Postgres (RDS) and a managed Kafka endpoint.
images:
  api: { repository: REGISTRY/cda-api, tag: "0.1.0" }
  worker: { repository: REGISTRY/cda-worker, tag: "0.1.0" }
  web: { repository: REGISTRY/cda-web, tag: "0.1.0" }

config:
  authIssuer: https://cda.example.com
  kafkaBootstrapServers: kafka.internal.example.com:9092 # replace with the managed broker endpoint
  kafkaReplicationFactor: 3
  retentionDays: 30

api:
  replicas: 3
  hpa: { minReplicas: 3, maxReplicas: 8 }
worker:
  replicas: 2
  hpa: { enabled: true, minReplicas: 2, maxReplicas: 3 }
  pdb: { enabled: true }

externalSecrets: { enabled: true }
monitoring: { serviceMonitor: { enabled: true } }
demoUsers: { enabled: false }
devInfra: { postgres: { enabled: false }, redpanda: { enabled: false } }
