# Full local stack: infrastructure + migrations + api + worker + web.
# `make up` builds the images and starts everything; open http://localhost:8080.
# Demo only. Not a medical device. Not for real patient data.
name: cda

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-cda}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cda} -d ${POSTGRES_DB:-cda}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --mode=dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations and create the demo users (local demo only; both are idempotent).
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: cda-api:dev
    command: ["sh", "-c", "alembic upgrade head && python -m cda_api.seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cda}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-cda}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    image: cda-api:dev
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cda}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-cda}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?run `make env` first to generate PII_ENCRYPTION_KEY}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me-at-least-32-characters}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:8000}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-cda-web}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    image: cda-worker:dev
    environment:
      <<: *app-env
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-8000}
      PROMPT_VERSION: ${PROMPT_VERSION:-v3}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "2.0", memory: 1500M } } }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: cda-web:dev
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/etc/nginx/conf.d:uid=101,gid=101"]  # rendered config goes here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { cpus: "0.5", memory: 128M } } }

volumes:
  pgdata:
  rpdata:
